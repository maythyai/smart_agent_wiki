feature:
  id: "F-A-2"
  name: "ingest+compile 链路冒烟"
  domain: "e2e-usability"
  prd_ref: "docs/prd/PRD-product-hardening-v1.md#section-3.1"
  pms_module: "e2e-usability"
  user_story: "作为 DEV，我想冒烟覆盖 ingest（md+url 提取）与 compile（wiki 增量）并断言溯源，以便确认入库→编译链路可用。"
  acceptance_criteria:
