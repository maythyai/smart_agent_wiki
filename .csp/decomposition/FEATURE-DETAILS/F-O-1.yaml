feature:
  id: "F-O-1"
  name: "semantic search 走 query cache（复用 F-QS-07，TTL + 索引变更失效）"
  domain: "debt-closure"
  prd_ref: "docs/prd/PRD-debt-closure-v1.11.0.md#3.1"
  pms_module: "debt-closure"
  user_story: "作为知识库运维者，我想重复语义查询走 cache 变快，以便大规模库下 semantic 检索不因全量 cosine 慢于 BM25。"
  acceptance_criteria:
    - "Given 同一 question + workspace_id + limit 的 semantic 查询已执行过一次（cache 已写入）, when 再次执行 saw search --mode semantic 同查询, then 返回结果与首次一致，不调用 embed_texts() / 不执行全量 cosine（AC-CACHE-1）"
    - "Given workspace A 的 semantic 结果已缓存, when workspace B 执行同查询, then cache miss，独立计算（不泄漏 A 结果）（AC-CACHE-2）"
    - "Given semantic 结果已缓存, when 执行 saw rebuild-embeddings（或内容写入触发 cache clear）, then cache 失效，下次查询重新计算（AC-CACHE-3）"
    - "Given embeddings unavailable，降级到 BM25（semantic_fallback=True）, when 再次同查询, then 不读 semantic cache（降级结果走 _keyword_search 自身 cache）（AC-CACHE-4）"
  scope:
    includes:
      - "_semantic_search 方法插入 cache.get/cache.set 路径，参照 _keyword_search 的 F-QS-07 cache 范式（engine.py L223-237 cache.get / L299-300 cache.set）"
      - "cache key 含 mode='semantic' + workspace_id + question_hash + limit + offset，与 _keyword_search 的 workspace_id 隔离对称"
      - "cache 命中时直接返回缓存结果，跳过 embed_texts() + 全量 cosine"
      - "cache 失效条件同 F-QS-07：TTL 过期 + 内容写入（claim/wiki ingest 触发 cache clear）+ embedding 索引重建（rebuild-embeddings 触发 cache clear）"
      - "semantic_fallback 降级结果不缓存（已走 _keyword_search 自身 cache）"
      - "index_empty 空结果不缓存（避免空索引状态被缓存阻塞后续重建）"
      - "cache 写入失败时 catch + 日志 warning，不阻塞查询返回"
    excludes:
      - "cache 底层模块实现（复用 F-QS-07 既有 cache 模块，不重造）"
      - "semantic 检索逻辑本身（F-N-2 既有实现，仅加 cache 层）"
      - "embedding 索引重建命令（F-N-1 既有实现）"
  frontend: {pages: [], components: [], interactions: []}
  backend:
    endpoints:
      - "GET /api/v1/search?mode=semantic（既有端点，行为不变仅加 cache 层）"
      - "CLI saw search --mode semantic（既有命令，行为不变仅加 cache 层）"
    business_logic:
      - "_semantic_search 入口处 cache.get(question, {mode:semantic, workspace_id, limit, offset})"
      - "cache miss → embed_texts() + cosine + 排序 → cache.set → 返回"
      - "cache 命中 → 直接返回缓存结果，跳过 embed_texts() + cosine"
      - "cache 失效：TTL 过期 / 内容写入触发 cache clear / rebuild-embeddings 触发 cache clear"
      - "降级结果（semantic_fallback=True）不写 cache"
      - "空索引结果（index_empty）不写 cache"
      - "cache 写入异常 catch + 日志 warning，不阻塞查询"
    integrations:
      - "F-QS-07 cache 模块（复用，_keyword_search 既有 cache.get/cache.set 路径）"
      - "F-N-2 _semantic_search（既有实现，加 cache 包装）"
      - "F-N-1 rebuild-embeddings 触发 cache clear（既有 cache invalidation 钩子）"
  data_entities:
    - "query_cache（既有表，复用 F-QS-07 cache 表结构，key 含 mode='semantic'）"
  data_operations:
    - "cache_get（semantic 查询时读 cache）"
    - "cache_set（semantic 查询计算后写 cache）"
    - "cache_clear（TTL 过期 / 内容写入 / rebuild-embeddings 触发失效）"
  tech_dimensions:
    needs_database: true
    needs_cache: true
    needs_queue: false
    needs_ai: true
    needs_vector_store: true
    needs_realtime: false
    needs_file_storage: false
    needs_search: true
    needs_scheduler: false
    needs_notification: false
  nfr:
    performance: "cache 命中后查询延迟 ≤ keyword cache 命中延迟（同量级）；命中率 [TBD]（须 benchmark 后定基线）"
    security: "cache key 须含 workspace_id，防跨 workspace 泄漏（与 _keyword_search 对称）"
    scalability: "cache 存储开销 [TBD]（每 semantic 查询结果 × TTL 期间缓存条数）"
    availability: "cache 写入失败时降级为无 cache，查询正常返回（不阻塞）"
  priority: "P0"
  complexity: "M"
  depends_on: []
  blocked_by: []
  risks:
    - "cache 失效逻辑与 F-QS-07 不对称——复用 F-QS-07 cache 模块，失效条件同 keyword，须确保 rebuild-embeddings 也触发 clear"
    - "cache key 遗漏 workspace_id 导致跨 workspace 泄漏——key 须含 mode + workspace_id + question_hash + limit + offset"
    - "空索引结果被缓存阻塞后续重建——index_empty 结果不缓存"
    - "降级结果重复缓存——semantic_fallback 结果不缓存（已走 keyword cache）"
  assumptions:
    - "F-QS-07 cache 模块支持自定义 key 前缀（mode='semantic'），可复用既有 cache.get/cache.set 接口"
    - "rebuild-embeddings 命令已有 cache invalidation 钩子（或可扩展触发 clear）"
    - "cache 命中率基线 [TBD]——须 benchmark 后定，PRD §1.3 标 [TBD]"
    - "TTL 值复用 F-QS-07 既有配置（不单独设 semantic TTL）"
