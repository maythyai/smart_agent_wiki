  user_story: "作为 OPS，我想所有 write/敏感 read 路由都挂 auth_dep，以便无裸路由暴露。"
  acceptance_criteria:
    - "Given 任意 write/敏感 read 路由, when 安全自检, then 0 裸路由（AC-SEC-1）"
