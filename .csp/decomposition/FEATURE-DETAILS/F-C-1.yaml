  scope:
    includes: ["裸路由检测（以 `app.py` include_router 为源）", "auth_dep 缺失告警", "权限矩阵（角色×功能×数据范围）文档化"]
    excludes: ["receipt（F-C-2）", "限流（F-C-3）", "URL 守卫（F-C-4）", "token 同源（F-C-5）"]
  frontend: {pages: [], components: [], interactions: []}
  backend:
    endpoints: []
    business_logic: ["权限校验（`auth/permissions.py:59` PermissionService + Cedar）", "auth_dep（`app.py:267`）", "自检脚本"]
    integrations: []
  data_entities: ["Role", "Permission", "Route"]
  data_operations: ["audit(routes)"]
  tech_dimensions: {needs_database: false, needs_cache: false, needs_queue: false, needs_ai: false, needs_vector_store: false, needs_realtime: false, needs_file_storage: false, needs_search: false, needs_scheduler: false, needs_notification: false}
  nfr: {performance: "", security: "0 裸 write 路由", scalability: "", availability: ""}
  priority: "P0"
  complexity: "M"
  depends_on: []
  blocked_by: []
  risks: []
  assumptions: ["复用 `PermissionService`/Cedar；估时 [TBD]"]
