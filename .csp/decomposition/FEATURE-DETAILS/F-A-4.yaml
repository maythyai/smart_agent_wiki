feature:
  id: "F-A-4"
  name: "govern+learn 链路冒烟"
  domain: "e2e-usability"
  prd_ref: "docs/prd/PRD-product-hardening-v1.md#section-3.1"
  pms_module: "e2e-usability"
  user_story: "作为 DEV，我想冒烟覆盖 govern（lint+verify）与 learn（distill），以便确认治理与学习链路可用。"
  acceptance_criteria:
    - "Given 已 ingest 库, when govern lint+verify, then 产出健康报告与 provenance chain"
    - "Given 已 ingest 库, when learn distill 一次, then 产出蒸馏结果不报错"
  scope:
    includes: ["govern lint 冒烟", "govern verify 冒烟", "learn distill 冒烟"]
    excludes: ["ingest/query（F-A-2/A-3）", "离线 fallback（F-A-5）"]
  frontend: {pages: [], components: [], interactions: []}
  backend:
    endpoints: []
    business_logic: ["Governor.lint（`governor.py:66`）/ verify_claim（:70）", "learn distill（`engines/learn/distiller.py`）"]
    integrations: []
  data_entities: ["HealthReport", "ProvenanceChain", "DistillResult"]
  data_operations: ["lint", "verify", "distill"]
  tech_dimensions: {needs_database: true, needs_cache: false, needs_queue: false, needs_ai: false, needs_vector_store: false, needs_realtime: false, needs_file_storage: false, needs_search: false, needs_scheduler: false, needs_notification: false}
  nfr: {performance: "", security: "", scalability: "", availability: ""}
  priority: "P0"
  complexity: "M"
  depends_on: ["F-A-1"]
  blocked_by: []
  risks: []
  assumptions: ["复用 `Governor`/`distiller`；估时 [TBD]"]
