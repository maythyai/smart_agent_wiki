feature:
  id: "F-Q-1"
  name: "embed_texts provider 重构为 litellm OpenAI 风格 API"
  domain: "embedding-api"
  prd_ref: "docs/prd/PRD-embedding-api-v1.12.0.md#3.1"
  pms_module: "embedding-api"
  user_story: "作为 OPS，我想 embedding 走 API 而非本地模型，以便生产部署无需安装 torch 且 runner 稳定。"
  acceptance_criteria:
    - "Given embedding API 配置已设置（model + api_key 或 api_base）, when 用户执行 saw search \"concept\" --mode semantic, then embed_texts() 通过 litellm API 获取向量，语义检索返回结果，semantic_fallback: false，exit 0（AC-EA-1）"
    - "Given embedding API 未配置（无 model/api_key）, when 用户执行 saw search \"concept\" --mode semantic, then 自动降级到 BM25，meta.semantic_fallback: true，exit 0，不报错（AC-EA-2）"
  scope:
    includes:
      - "embeddings.py::embed_texts() provider 从本地 SentenceTransformer(\"all-MiniLM-L6-v2\").encode() 重构为 litellm.embedding/aembedding 调用"
      - "base_url/api_key/model 走 config，复用既有 LLMSettings 的 api_base/api_key 范式（settings.py:19-26），新增 embedding 专用配置项"
      - "embeddings_available() 检测逻辑从 importlib.import_module(\"sentence_transformers\") 改为检测 embedding API 配置可用（有 model + 有 api_key 或 api_base）"
      - "detect_tier() FULL 条件相应调整——不再以本地 ST 可 import 为前提，改为以 embedding API 配置可用为前提"
      - "embed_texts() 失败时返回 None（既有契约不变），调用方降级到非语义路径"
      - "embed_texts(texts) -> list[list[float]] | None 签名保持，下游 _semantic_search/EmbeddingSink.write/compute_related_pages 无需改动"
      - "cluster_by_embedding() 同样走新 provider（调 embed_texts 自动受益）"
    excludes:
      - "litellm embedding API 具体调用参数/模型名选型（03 技术方案 ADR）"
      - "维度可配 + 重建检测（F-Q-2）"
      - "本地 ST 可选 fallback 逻辑（F-Q-3）"
      - "测试改 API mock（F-Q-4）"
      - "向量数据库选型（沿用 v1.10.0 本地 SQLite BLOB + numpy cosine，不变）"
  frontend: {pages: [], components: [], interactions: []}
  backend:
    endpoints:
      - "GET /api/v1/search?mode=semantic（既有端点，行为不变，仅 provider 换）"
      - "CLI saw search --mode semantic（既有命令，行为不变，仅 provider 换）"
      - "CLI saw ingest（既有命令，EmbeddingSink 调 embed_texts 自动受益）"
      - "CLI saw links suggest（既有命令，compute_related_pages 调 embed_texts 自动受益）"
    business_logic:
      - "embed_texts() 内部：检查 API 配置 → 调 litellm.embedding(model=cfg.model, input=texts, api_base=cfg.api_base, api_key=cfg.api_key) → 返回 list[list[float]]"
      - "embed_texts() 失败 try/except 返回 None（既有契约不变）"
      - "embeddings_available() 改为：API 配置可用（有 model + 有 api_key 或 api_base）→ True"
      - "detect_tier() FULL 条件：API 配置可用 OR 本地 ST 可 import（F-Q-3 扩展为 OR）"
      - "API key 未配置 → embeddings_available() 返回 False → tier=LIGHTWEIGHT → 语义端点回退 BM25 + semantic_fallback: true"
      - "API 调用失败（网络/限流/超时）→ embed_texts() try/except 返回 None → 调用方降级"
      - "API 返回维度异常（空向量/维度不匹配）→ embed_texts() 返回 None → 调用方降级"
    integrations:
      - "litellm（已在核心依赖 pyproject.toml:13 litellm>=1.83.13，litellm.embedding/aembedding 同包可用）"
      - "LLMSettings 范式复用（settings.py:19-26 api_base/api_key/model）"
      - "_MODEL_ENV_KEYS 映射 model prefix → env var（router.py:133）embedding model 同样可走 env var 范式"
      - "_endpoint_kwargs 范式（router.py:191-194）处理 api_base/api_key 路由，embedding API 调用可复用"
  data_entities:
    - "embedding API 配置（config: base_url/api_key/model，复用 LLMSettings 范式）"
  data_operations:
    - "embed_texts（调 litellm API 获取向量）"
    - "embeddings_available（检测 API 配置可用）"
    - "detect_tier（FULL 条件改为 API 配置可用）"
  tech_dimensions:
    needs_database: false
    needs_cache: false
    needs_queue: false
    needs_ai: true
    needs_vector_store: true
    needs_realtime: false
    needs_file_storage: false
    needs_search: true
    needs_scheduler: false
    needs_notification: false
  nfr:
    performance: "API embedding P99 延迟 [TBD]（须优于或接近 BM25 的毫秒级，benchmark 后定 baseline）"
    security: "API key 走 config/env，复用既有 LLM 同套 env 范式（OPENAI_API_KEY 等），不硬编码"
    scalability: "API 限流/延迟影响检索体验 → 降级策略：API 失败 → BM25"
    availability: "API 不可用时降级 BM25，不报错不中断（semantic_fallback: true）"
  priority: "P0"
  complexity: "M"
  depends_on: []
  blocked_by: []
  risks:
    - "API 限流/延迟影响检索体验——降级策略兜底（API 失败 → BM25），P99 benchmark 后定 baseline"
    - "API key 配置门槛——复用既有 LLM 同套 env 范式，用户已有 LLM 配置时零额外配置"
    - "litellm.embedding API 行为与预期不一致——须 03 技术方案验证 litellm.embedding 返回格式"
    - "embeddings_available() 检测逻辑变更影响 detect_tier——须确保 tier 判断与既有 LIGHTWEIGHT/FULL 语义一致"
  assumptions:
    - "litellm.embedding/aembedding 在已装版本（>=1.83.13）可用，返回格式与 OpenAI embedding API 一致"
    - "embedding API 配置复用 LLMSettings 范式（新增 embedding 专用配置项，具体字段名归 03 技术方案）"
    - "API embedding P99 延迟 [TBD]——须 benchmark 后定 baseline，PRD §1.3 标 [TBD]"
    - "调用方接口不变——embed_texts(texts) -> list[list[float]] | None 签名保持，下游无需改动"
