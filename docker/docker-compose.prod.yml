# Smart Agent Wiki — Production Docker Compose (T-F-P-2)
#
# Self-contained team-deployment stack: SAW app (SQLite, persistent volume)
# + optional Redis (session/cache for team mode) + healthcheck on the real
# /health/ready probe (v1.2.0 engine-aware). Secrets are env-injected —
# NEVER baked into the image or committed (AC-DEPLOY-2, detect-private-key).
#
# Usage:
#   SAW_AUTH_SECRET_KEY=$(openssl rand -hex 32) \
#   docker compose -f docker/docker-compose.prod.yml up -d
#   docker compose -f docker/docker-compose.prod.yml logs -f saw
#   docker compose -f docker/docker-compose.prod.yml down
#
# Operator MUST set before `up`:
#   SAW_AUTH_SECRET_KEY   JWT signing secret (required in team mode)
#   SAW_ADMIN_USER / SAW_ADMIN_PASSWORD  initial admin (optional, bootstrap)
#   SENTRY_DSN           optional telemetry

version: "3.8"

services:
  saw:
    image: chensaics/saw:latest
    container_name: saw-prod
    restart: always
    working_dir: /wiki
    volumes:
      # Persistent wiki content + SQLite DB (.saw/db/claims.db) + receipts.
      - ./wiki:/wiki
      - saw-prod-data:/home/saw/.local/share/saw
    environment:
      - SAW_AUTH_MODE=team
      # AC-DEPLOY-2: secret read from env, no value committed.
      - SAW_AUTH_SECRET_KEY=${SAW_AUTH_SECRET_KEY:?SAW_AUTH_SECRET_KEY must be set}
      - SAW_ADMIN_USER=${SAW_ADMIN_USER:-}
      - SAW_ADMIN_PASSWORD=${SAW_ADMIN_PASSWORD:-}
      - SAW_ENV=production
      - SAW_LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - SENTRY_DSN=${SENTRY_DSN:-}
    ports:
      - "8000:8000"
    command: web --host 0.0.0.0 --port 8000
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # AC-DEPLOY-1: probe the real readiness endpoint (engines + db).
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m

  redis:
    image: redis:7-alpine
    container_name: saw-prod-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - saw-prod-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  saw-prod-data:
    driver: local
  saw-prod-redis:
    driver: local

networks:
  default:
    name: saw-prod-network
