# Smart Agent Wiki - Production Docker Compose
# Phase 5: Team Deployment
#
# Extends base docker-compose.yml for production deployment
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  app:
    environment:
      - LOG_LEVEL=WARNING
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: always

  db:
    environment:
      # Use secrets in production
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
    restart: always
    secrets:
      - db_password

  redis:
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: always

  backup:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saw
      POSTGRES_PASSWORD: saw
      POSTGRES_HOST: db
      POSTGRES_DB: saw
      BACKUP_SCHEDULE: "0 2 * * *"
    volumes:
      - ../data/backups:/backups
    entrypoint: |
      sh -c 'while true; do
        sleep 86400
        current=$(date +%Y%m%d_%H%M%S)
        pg_dump -h db -U saw saw > /backups/saw_backup_$$current.sql
        find /backups -name "saw_backup_*" -mtime +7 -delete
      done'
    depends_on:
      - db
    restart: always

volumes:
  postgres_prod_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt