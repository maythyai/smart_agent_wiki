name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check src/
      - name: Run tests
        run: pytest tests/ -x -q
      # T-F-E-3: coverage gate (AC-TEST-1/AC-TEST-2). Ratchets at the
      # measured baseline (fail_under=60 in pyproject); heavy-SDK learn
      # extras (sentence-transformers) are ignored — they need an SDK not
      # in the dev install and were excluded from the baseline measurement.
      - name: Coverage gate
        run: |
          pytest tests/ -q \
            --cov=src/saw \
            --cov-report=term-missing

  # T-F-A-6: end-to-end smoke as a CI gate (AC-E2E-1). `saw smoke` runs the
  # engine chain on a fresh temp DB offline; a non-zero exit fails the job.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run smoke
        run: saw smoke

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Type check
        working-directory: web
        run: npx tsc --noEmit
      - name: Lint
        working-directory: web
        run: npx eslint . --quiet
      - name: Test
        working-directory: web
        run: npx vitest run
