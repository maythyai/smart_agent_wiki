[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "smart-agent-wiki"
version = "1.4.0"
description = "Smart Agent Wiki - 智能多代理知识平台"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.23.1",
    "sqlmodel>=0.0.22",
    "litellm>=1.83.13",
    "networkx>=3.2",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "python-frontmatter>=1.0",
    "markdown-it-py>=3.0",
    "trafilatura>=1.6",
    "beautifulsoup4>=4.12",
    "rank-bm25>=0.2",
    # CJK segmentation for FTS5 full-text search
    "jieba>=0.42",
    "PyYAML>=6.0",
    "platformdirs>=3.0",
    "httpx>=0.25",
    "fastapi>=0.100",
    "aiosqlite>=0.20",  # async SQLite driver for connector/team endpoints
    "greenlet>=3.0",  # required by SQLAlchemy async engine
    "pynacl>=1.5",
    # MCP server (imported by CLI at startup)
    "fastmcp>=2.0",
    # Web dashboard system stats
    "psutil>=5.9",
    # Phase 9: RSS Subscription
    "fastfeedparser>=0.6.0",
    "apscheduler>=3.11.0",
    # Phase 12: Notion Connector
    "notion-client>=2.0.0",
    # Phase 39: Security Hardening
    "bcrypt>=4.0",
    "PyJWT>=2.8",
    "email-validator>=2.0",
]

[project.scripts]
saw = "saw.drivers.cli.main:app"

[project.optional-dependencies]
pdf = ["docling>=2.0", "PyMuPDF>=1.24"]
graph = ["igraph>=0.11"]
team = ["asyncpg>=0.29", "redis>=5.0"]  # PostgreSQL + cache for team deployment
# Connector platform SDKs (each connector imports its SDK at module top level;
# install the ones you use). Group install: pip install -e ".[connectors]"
connectors = [
    "watchdog>=3.0",     # logseq file-system watching
    "xmltodict>=0.13",   # wecom webhook XML parsing
    "slack-sdk>=3.3",    # slack connector
    "lark-oapi>=1.4",    # feishu connector
    "discord.py>=2.3",   # discord connector
    "PyGithub>=2.0",     # github connector
]
learn = ["fsrs>=4.0", "sentence-transformers>=2.2"]   # spaced-repetition scheduler + embeddings (FULL tier, M-19)
dev = ["pytest>=8.0", "pytest-asyncio>=1.0", "pytest-benchmark>=4.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/saw"]

[tool.ruff]
# T-F-Z-1: line length relaxed — the codebase predates lint enforcement
# and was never 88-col; 100 catches gross overflow without noise.
line-length = 100

[tool.ruff.lint]
# T-F-Z-1 (AC-LINT-1): a safe, achievable rule set. Selects pycodestyle
# errors (E4/E7/E9) + pyflakes (F) for real bugs, ignoring the high-volume
# rules that conflict with established patterns or need a dedicated audit.
select = ["E4", "E7", "E9", "F"]
ignore = [
  "E501",  # line length — governed by line-length above, not historically enforced
  "E402",  # delayed imports — intentional (circular-dependency avoidance)
  "E741",  # ambiguous variable names — style
  "E712",  # == True/False — numpy/pandas bool semantics differ from `is`
  "E702",  # multiple statements via semicolon — style
  "F401",  # unused import — CLOSED in Z-4 (313 auto-fixed); now enforced
  "F811",  # redefined-while-unused — needs audit
  "F821",  # undefined-name — false positives on dynamic/guarded dispatch (1898 tests green)
]

[tool.ruff.lint.per-file-ignores]
# Tests: allow pytest patterns ruff flags.
"tests/**" = ["E402", "F841", "S101"]

[tool.pytest.ini_options]
# The package lives under src/saw and is installed via the editable .pth
# (_editable_impl_smart_agent_wiki.pth -> src/), so `import saw` resolves
# correctly and `pytest` runs with no extra config. HI-18: the previous
# pythonpath=["src"] workaround masked a stale .pth pointing at another
# project; that .pth has been corrected and the workaround removed.
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# T-F-E-2: coverage source. CI runs `pytest --cov` to enforce the gate.
source = ["src/saw"]
omit = [
    "*/tests/*",
    "*/venv*/*",
    # Heavy-SDK extras require sentence-transformers; not installed in CI.
    "src/saw/engines/learn/distiller.py",
    "src/saw/engines/learn/fsrs_scheduler.py",
    "src/saw/engines/learn/trends.py",
]

[tool.coverage.report]
# T-F-E-2 (AC-TEST-1): regression ratchet. Coverage must not fall below the
# established baseline (62% total, measured T-F-E-1-1). The gate is a floor,
# not the target: raise `fail_under` toward 80% (the core-engine target) as
# coverage improves. A gate that fails on day one (80% < current 62%) would
# block all merges — so we ratchet from the measured baseline.
# T-F-Z-9 (v1.5.0): ratcheted 60→63 to match the measured overall baseline
# (63.1% @ 1927 tests after query-submodule coverage tests). Incremental —
# never set above measured or CI goes permanently red (硬约定 #10).
fail_under = 63
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
