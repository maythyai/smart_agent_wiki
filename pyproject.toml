[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "smart-agent-wiki"
version = "1.0.1"
description = "Smart Agent Wiki - 智能多代理知识平台"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.23.1",
    "sqlmodel>=0.0.22",
    "litellm>=1.83.13",
    "networkx>=3.2",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "python-frontmatter>=1.0",
    "markdown-it-py>=3.0",
    "trafilatura>=1.6",
    "beautifulsoup4>=4.12",
    "rank-bm25>=0.2",
    # CJK segmentation for FTS5 full-text search
    "jieba>=0.42",
    "PyYAML>=6.0",
    "platformdirs>=3.0",
    "httpx>=0.25",
    "fastapi>=0.100",
    "aiosqlite>=0.20",  # async SQLite driver for connector/team endpoints
    "greenlet>=3.0",  # required by SQLAlchemy async engine
    "pynacl>=1.5",
    # MCP server (imported by CLI at startup)
    "fastmcp>=2.0",
    # Web dashboard system stats
    "psutil>=5.9",
    # Phase 9: RSS Subscription
    "fastfeedparser>=0.6.0",
    "apscheduler>=3.11.0",
    # Phase 12: Notion Connector
    "notion-client>=2.0.0",
    # Phase 39: Security Hardening
    "bcrypt>=4.0",
    "PyJWT>=2.8",
    "email-validator>=2.0",
]

[project.scripts]
saw = "saw.drivers.cli.main:app"

[project.optional-dependencies]
pdf = ["docling>=2.0", "PyMuPDF>=1.24"]
graph = ["igraph>=0.11"]
team = ["asyncpg>=0.29", "redis>=5.0"]  # PostgreSQL + cache for team deployment
# Connector platform SDKs (each connector imports its SDK at module top level;
# install the ones you use). Group install: pip install -e ".[connectors]"
connectors = [
    "watchdog>=3.0",     # logseq file-system watching
    "xmltodict>=0.13",   # wecom webhook XML parsing
    "slack-sdk>=3.3",    # slack connector
    "lark-oapi>=1.4",    # feishu connector
    "discord.py>=2.3",   # discord connector
    "PyGithub>=2.0",     # github connector
]
learn = ["fsrs>=4.0", "sentence-transformers>=2.2"]   # spaced-repetition scheduler + embeddings (FULL tier, M-19)
dev = ["pytest>=8.0", "pytest-asyncio>=1.0", "pytest-benchmark>=4.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/saw"]

[tool.pytest.ini_options]
# The package lives under src/saw and is installed via the editable .pth
# (_editable_impl_smart_agent_wiki.pth -> src/), so `import saw` resolves
# correctly and `pytest` runs with no extra config. HI-18: the previous
# pythonpath=["src"] workaround masked a stale .pth pointing at another
# project; that .pth has been corrected and the workaround removed.
asyncio_mode = "auto"
testpaths = ["tests"]
